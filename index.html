<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JQC Vidros</title>

<link rel="icon" type="image/png" href="https://ugc.production.linktr.ee/d89d10e9-b14b-4bbe-866e-bd9419641708_AIdro-klcE4Vac-sTmucC3ioIFBI2Bv0QHUtsYy45fRWhsCjQAE-s800-c-k-c0x00ffffff-no-rj.jpeg?io=true&size=avatar-v3_0">

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        color: white;
        text-align: center;
        overflow-x: hidden;
        background: linear-gradient(130deg, #0b70a8, #00649c, #0080c0);
        background-size: 300% 300%;
        animation: gradientMove 12s ease infinite;
    }

    @keyframes gradientMove {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .container {
        max-width: 500px;
        margin: auto;
        padding: 15px;
    }

    .profile-img {
        width: 130px;
        height: 130px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid rgba(255,255,255,0.55);
        margin-top: 25px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    }

    h1 { 
        margin: 15px 0 5px;
        font-size: 30px;
        font-weight: 700;
        text-shadow: 0 3px 12px rgba(0,0,0,0.3);
    }

    h2 {
        margin: 0;
        font-size: 16px;
        opacity: 0.95;
        font-weight: 400;
    }

    .social-row {
        margin: 20px 0 30px;
        display: flex;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
    }

    .social-row img {
        width: 32px;
        height: 32px;
        transition: 0.2s;
    }

    .social-row img:hover {
        transform: scale(1.18);
    }

    .link-btn {
        width: 100%;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 14px;
        background: rgba(255,255,255,0.28);
        padding: 16px;
        margin: 12px 0;
        border-radius: 18px;
        color: white;
        font-size: 17px;
        font-weight: 600;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 4px 14px rgba(0,0,0,0.28);
        transition: 0.15s;
    }

    .link-btn:hover {
        transform: scale(1.03);
        background: rgba(255,255,255,0.42);
    }

    .small-icon {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: contain;
        flex-shrink: 0;
    }
</style>
</head>

<body>

<div class="container">

    <img class="profile-img" src="https://ugc.production.linktr.ee/d89d10e9-b14b-4bbe-866e-bd9419641708_AIdro-klcE4Vac-sTmucC3ioIFBI2Bv0QHUtsYy45fRWhsCjQAE-s800-c-k-c0x00ffffff-no-rj.jpeg?io=true&size=avatar-v3_0">

    <h1>JQC Vidros</h1>
    <h2>Vidros Temperados</h2>

    <div class="social-row">
        <a href="https://www.instagram.com/jqcvidros" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg"></a>
        <a href="https://wa.me/5575981358280" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"></a>
        <a href="https://www.youtube.com/@jqcvidros" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png"></a>
        <a href="https://www.facebook.com/jqcvidros" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png"></a>
    </div>

    <!-- WhatsApp -->
    <a class="link-btn" href="https://wa.me/5575981358280" target="_blank">
        <img class="small-icon" src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
        WhatsApp
    </a>

    <!-- Instagram -->
    <a class="link-btn" href="https://www.instagram.com/jqcvidros" target="_blank">
        <img class="small-icon" src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg">
        Instagram
    </a>

    <!-- YouTube -->
    <a class="link-btn" href="https://www.youtube.com/@jqcvidros" target="_blank">
        <img class="small-icon" src="https://upload.wikimedia.org/wikipedia/commons/4/42/YouTube_icon_%282013-2017%29.png">
        YouTube
    </a>

    <!-- Facebook -->
    <a class="link-btn" href="https://www.facebook.com/jqcvidros" target="_blank">
        <img class="small-icon" src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png">
        Facebook
    </a>

    <!-- Google Maps → ícone corrigido -->
    <a class="link-btn" href="https://maps.app.goo.gl/zTe119CUKGirQGHk8" target="_blank">
        <img class="small-icon" src="https://upload.wikimedia.org/wikipedia/commons/8/88/Map_marker.svg">
        Ver no Google Maps
    </a>

</div>

</body>
</html>
